[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epigenomics-mcp"
version = "0.2.0"
description = "Python metadata compatibility package for the TypeScript Epigenomics MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Epigenomics MCP maintainer" }
]
keywords = [
    "mcp",
    "epigenomics",
    "bioinformatics",
    "toxmcp",
    "dose-response",
    "ngra"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
analysis-compat = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "bioframe>=0.7.0",
    "duckdb>=1.0",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "httpx>=0.27",
    "typer>=0.12",
    "mcp>=1.0,<2.0.0",
]
large-intervals = [
    "polars>=1.0",
    "pyarrow>=15",
]
adapters = [
    "biopython>=1.80",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/ToxMCP/epigenomics-mcp"
Repository = "https://github.com/ToxMCP/epigenomics-mcp.git"
Issues = "https://github.com/ToxMCP/epigenomics-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --strict-config --cov=epigenomics_mcp --cov-report=term-missing --cov-report=html:htmlcov --cov-report=json:coverage.json"

[tool.coverage.run]
source = ["src/epigenomics_mcp"]
branch = true
omit = [
    "*/__pycache__/*",
    "*/tests/*",
]

[tool.coverage.report]
precision = 1
skip_covered = false
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.json]
output = "coverage.json"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_equality = true
