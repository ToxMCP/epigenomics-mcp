name: Handoff Validation

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handoff-validation:
    name: Validate Bioactivity-PoD Handoff Packets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run handoff validator unit tests
        run: npx vitest run tests/unit/handoff_validator.test.ts

      - name: Validate benchmark handoff fixtures
        run: node scripts/validate-handoffs.mjs

      - name: Validate handoff schema exports are current
        run: |
          node scripts/export-schemas.mjs /tmp/exported-schemas
          diff -ru schemas/current/bioactivity-pod-handoff-packet.json /tmp/exported-schemas/bioactivity-pod-handoff-packet.json
