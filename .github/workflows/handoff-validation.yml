name: Handoff Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handoff-validation:
    name: Validate Bioactivity-PoD Handoff Packets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run handoff validator unit tests
        run: npx vitest run tests/unit/handoff_validator.test.ts

      - name: Validate benchmark handoff fixtures
        run: node scripts/validate-handoffs.mjs

      - name: Validate handoff schema exports are current
        run: |
          node scripts/export-schemas.mjs /tmp/exported-schemas
          diff -ru schemas/current/bioactivity-pod-handoff-packet.json /tmp/exported-schemas/bioactivity-pod-handoff-packet.json
