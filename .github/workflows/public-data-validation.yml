name: Full Public-Data Validation

on:
  workflow_dispatch:

concurrency:
  group: public-data-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Three Complete Public Sources
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore verified public-source cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: benchmark-cache/public-data
          key: epimcp-public-data-${{ hashFiles('benchmarks/public_validation/manifest.json') }}

      - name: Run complete-file validation through MCP
        run: npm run validate:public-data

      - name: Upload public-data report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-data-validation-report
          path: benchmark-results/public-data/
          if-no-files-found: warn
          retention-days: 30
