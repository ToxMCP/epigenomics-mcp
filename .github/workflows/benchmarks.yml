name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-benchmark:
    name: Golden and Performance Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run benchmark release gate
        id: benchmark
        run: npm run benchmark:ci

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-reports
          path: benchmark-results/
          retention-days: 14

      - name: Upload benchmark diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-diffs
          path: benchmark-results/diffs/
          retention-days: 14

      - name: Annotate failures
        if: failure()
        run: |
          echo "::error::Benchmark release gate failed. See uploaded artifacts for reports and diffs."
          if [ -f benchmark-results/report.txt ]; then
            cat benchmark-results/report.txt
          fi
