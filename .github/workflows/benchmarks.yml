name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-benchmark:
    name: Golden and Performance Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run benchmark release gate
        id: benchmark
        run: npm run benchmark:ci

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: benchmark-results/
          retention-days: 14

      - name: Upload benchmark diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-diffs
          path: benchmark-results/diffs/
          retention-days: 14

      - name: Annotate failures
        if: failure()
        run: |
          echo "::error::Benchmark release gate failed. See uploaded artifacts for reports and diffs."
          if [ -f benchmark-results/report.txt ]; then
            cat benchmark-results/report.txt
          fi
