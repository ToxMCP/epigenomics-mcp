name: Dependency security

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - pyproject.toml
      - uv.lock
      - .github/workflows/dependency-security.yml
  push:
    branches: [main, master]
    paths:
      - package.json
      - package-lock.json
      - pyproject.toml
      - uv.lock
      - .github/workflows/dependency-security.yml
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-dependencies:
    name: npm runtime and development advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Audit all locked npm packages
        run: npm audit --package-lock-only --include=dev --audit-level=low

  python-compatibility:
    name: Optional Python compatibility advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Export locked optional runtime dependencies
        run: uv export --locked --all-extras --no-dev --no-emit-project --output-file /tmp/epigenomics-python-requirements.txt
      - name: Audit locked optional runtime dependencies
        run: uvx pip-audit --requirement /tmp/epigenomics-python-requirements.txt --no-deps --disable-pip
