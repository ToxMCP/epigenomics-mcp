name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so verify-evidence.mjs can run `git merge-base
          # --is-ancestor <evidence source commit> HEAD` (fails on a shallow
          # clone: the pinned source commit is absent).
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python for cross-runtime smoke tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python smoke dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Lint
        run: npm run lint

      - name: Validate MCP evaluation set
        run: npm run eval:validate

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify committed release evidence
        run: npm run verify:evidence

      - name: Generate CI release evidence artifact
        if: matrix.node-version == 20
        run: npm run release:evidence -- --out-dir /tmp/epimcp-release-evidence

      - name: Upload CI release evidence artifact
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: ci-release-evidence
          path: /tmp/epimcp-release-evidence/
          retention-days: 14

      - name: Run complete Vitest suite
        run: npx vitest run --coverage

      - name: Run protocol-level MCP smoke tests
        run: npm run smoke:mcp

      - name: Run benchmark release gate
        run: npm run benchmark:ci

      - name: Upload benchmark gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report-node-${{ matrix.node-version }}
          path: benchmark-results/release-gate.*
          retention-days: 14

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 14

  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src/epigenomics_mcp tests/python

      - name: Type check with mypy
        run: mypy src/epigenomics_mcp

      - name: Run Python unit tests
        run: pytest --cov=epigenomics_mcp --cov-report=xml --cov-report=term tests/python

      - name: Upload Python coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14
