name: MCP Conformance

# Advisory Track-A conformance gates. These jobs add a visible CI signal,
# enforced by merge discipline (this repo is on the GitHub Free plan, so the
# checks are not configured as required status checks and do not hard-block
# merges by themselves).
#
# Gates exercised here:
#   - mcp-conformance baseline + manifest-drift
#       tests/conformance/mcp_conformance.test.ts spawns the BUILT server over
#       stdio with the real MCP client SDK and asserts the advertised tool and
#       resource surface matches the committed toxmcp.manifest.yaml exactly.
#   - schema-drift (validation arm)
#       tests/conformance/schema_validation.test.ts Ajv-compiles every committed
#       JSON Schema and validates the committed example fixtures against them.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: MCP Conformance (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run MCP conformance + schema-validation gates
        run: npx vitest run tests/conformance
