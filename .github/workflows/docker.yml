name: Docker Build and Smoke

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-smoke:
    name: Docker Image Build and Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t epigenomics-mcp:smoke .

      - name: Smoke test — epimcp --help
        run: |
          OUTPUT=$(docker run --rm epigenomics-mcp:smoke --help)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "epimcp"
          echo "$OUTPUT" | grep -q "USAGE"
          echo "$OUTPUT" | grep -q "COMMANDS"

      - name: Smoke test — Node.js import
        run: |
          docker run --rm --entrypoint node epigenomics-mcp:smoke \
            -e "import('./dist/epimcp/index.js').then(m => console.log('VERSION:', m.VERSION))"

      - name: Smoke test — stdio protocol lifecycle
        run: docker run --rm --entrypoint node epigenomics-mcp:smoke scripts/smoke_mcp_stdio.mjs

      - name: Smoke test — Streamable HTTP protocol lifecycle
        run: docker run --rm --entrypoint node epigenomics-mcp:smoke scripts/smoke_mcp_http.mjs
